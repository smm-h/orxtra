# orxtra -- single publishable package
# Sub-projects remain as workspace members for development but are never published separately.
# A custom build hook (hatch_build.py) derives force-include at build time from workspace members.

[project]
name = "orxtra"
version = "0.8.0"
license = "BUSL-1.1"
description = "Autonomous multi-agent AI workflows"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]",
    "ag-ui-protocol",
    "asyncpg",
    "fastware",
    "httpx",
    "jsonpatch",
    "jsonschema",
    "mcp>=1.27,<2",
    "pathspec",
    "pydantic>=2",
    "strictcli",
    "uuid6",
    "websockets",
]
keywords = ["rlsbl"]

[project.scripts]
orxtra = "orxtra.cli._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# hatch_build.py is auto-included by hatchling (DEFAULT_BUILD_SCRIPT);
# sub-project sources are included via the hook's force_include for
# standard builds. Only pyproject.toml needs explicit inclusion here.
include = [
    "pyproject.toml",
    "hatch_build.py",
    "protocols/src/",
    "secrets/src/",
    "write-safety/src/",
    "transport/src/",
    "agent/src/",
    "tool/src/",
    "verify/src/",
    "trace/src/",
    "notepad/src/",
    "session/src/",
    "scheduler/src/",
    "overseer/src/",
    "services/src/",
    "cli/src/",
    "mcp/src/",
    "dispatch/src/",
    "auth/src/",
    "a2ui/src/",
    "a2a/src/",
    "agui/src/",
    "api/src/",
    "worker/src/",
    "compose/src/",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.uv.workspace]
members = [
    "protocols",
    "secrets",
    "write-safety",
    "transport",
    "agent",
    "tool",
    "verify",
    "trace",
    "notepad",
    "session",
    "scheduler",
    "overseer",
    "services",
    "cli",
    "mcp",
    "dispatch",
    "auth",
    "a2ui",
    "a2a",
    "agui",
    "api",
    "worker",
    "compose",
]

[tool.uv.sources]
orxtra-protocols = { workspace = true }
orxtra-secrets = { workspace = true }
orxtra-write-safety = { workspace = true }
orxtra-transport = { workspace = true }
orxtra-agent = { workspace = true }
orxtra-tool = { workspace = true }
orxtra-verify = { workspace = true }
orxtra-trace = { workspace = true }
orxtra-notepad = { workspace = true }
orxtra-session = { workspace = true }
orxtra-scheduler = { workspace = true }
orxtra-overseer = { workspace = true }
orxtra-services = { workspace = true }
orxtra-cli = { workspace = true }
orxtra-mcp = { workspace = true }
orxtra-dispatch = { workspace = true }
orxtra-auth = { workspace = true }
orxtra-a2ui = { workspace = true }
orxtra-a2a = { workspace = true }
orxtra-agui = { workspace = true }
orxtra-api = { workspace = true }
orxtra-worker = { workspace = true }
orxtra-compose = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "asyncpg-stubs",
    "mypy",
    "ruff",
    "testcontainers[postgres]",
    # Workspace members: plain `uv sync` installs all sub-projects editable
    # via [tool.uv.sources] workspace entries. PEP 735 dev-groups are never
    # published in METADATA -- they only affect local/CI installs.
    "orxtra-protocols",
    "orxtra-secrets",
    "orxtra-write-safety",
    "orxtra-transport",
    "orxtra-agent",
    "orxtra-tool",
    "orxtra-verify",
    "orxtra-trace",
    "orxtra-notepad",
    "orxtra-session",
    "orxtra-scheduler",
    "orxtra-overseer",
    "orxtra-services",
    "orxtra-cli",
    "orxtra-mcp",
    "orxtra-dispatch",
    "orxtra-auth",
    "orxtra-a2ui",
    "orxtra-a2a",
    "orxtra-agui",
    "orxtra-api",
    "orxtra-worker",
    "orxtra-compose",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # pydocstyle -- no docstrings by convention
    "COM812",  # trailing comma (conflicts with ruff format)
    "ISC001",  # implicit string concat (conflicts with ruff format)
    "T201",    # print() -- needed in CLI
    "FBT",     # boolean positional args -- too noisy for tool constructors
    "TD",      # todo comments -- not relevant
    "FIX",     # fixme comments -- not relevant
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",    # assert in tests is fine
    "PLR2004", # magic values in tests are fine
    "ARG",     # unused args in fixtures are fine
    "INP001",  # tests are implicit namespace packages
]
"**/_task.py" = ["TC002", "TC003"]   # pydantic models need runtime imports
"**/_tools.py" = ["TC002", "TC003"]  # pydantic models need runtime imports
"**/_execution.py" = ["TC002", "TC003"]  # pydantic models need runtime imports
"**/_types.py" = ["TC002", "TC003"]  # pydantic models need runtime imports
"**/_actions.py" = ["TC002", "TC003"]  # pydantic models need runtime imports
"**/_checks.py" = ["TC002", "TC003"]  # pydantic models/check types need runtime imports
"**/_protocol.py" = ["TC002", "TC003"]  # pydantic models need runtime imports
"**/_events.py" = ["TC003"]  # dataclass field annotations need runtime imports
"**/_tool.py" = ["UP046"]  # ToolOutput uses Generic[T] (matches original code)
"**/_writer.py" = ["PLR0913"]  # DB write methods have many columns
"hatch_build.py" = [
    "INP001",  # build hook is a standalone script, not a package
]
"scripts/**" = [
    "S603",    # subprocess calls are expected in scripts
    "INP001",  # scripts are implicit namespace packages
]
# pgdesign-generated DDL modules: machine-generated code with long DDL strings,
# unsorted imports, and patterns that don't match hand-written style rules.
# Suppressed globally for the generated path; pgdesign codegen --check is the
# freshness gate, not ruff.
"schema/_generated/**" = [
    "E501",     # long lines: DDL strings and inline SQL are inherently wide
    "I001",     # import order: generated code has its own ordering
    "N811",     # constant aliasing: STATEMENTS imported as _*_stmts
    "PYI024",   # namedtuple vs NamedTuple: generated code uses collections.namedtuple
    "TRY003",   # long exception messages inline: generated code patterns
    "EM101",    # string literal in exception: generated code patterns
    "EM102",    # f-string in exception: generated code patterns
    "ANN001",   # missing type annotation: protocol __aexit__ params
    "UP035",    # deprecated typing imports: generated code targets broad compatibility
    "PYI034",   # __aenter__ return type: generated protocol
    "PLR0913",  # too many arguments: execute() has many options
    "PLR0912",  # too many branches: execute() handles many section kinds
    "C901",     # complexity: Section.exists() dispatches across many kinds
    "BLE001",   # blind except: generated error handling
    "INP001",   # implicit namespace package: _generated is a standalone package
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "strictcli.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastware.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "a2a.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ag_ui.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.protobuf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "orxtra.cli._cli"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "orxtra.api._cli"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "orxtra.api._compositor"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "orxtra.worker._cli"
disallow_untyped_decorators = false

# pgdesign-generated DDL modules have minor type annotation gaps
# (untyped __aexit__ params, bare dict instead of dict[str, Any],
# async context manager protocol mismatch). Filed as pgdesign todo.
[[tool.mypy.overrides]]
module = "_generated.*"
strict = false
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
