format_version = 1
# auth module PostgreSQL schema
# Single owner: the auth module. No other module writes to these tables directly.
# Consumers are API clients; credentials link to consumers for authentication.

[meta]
version = 2
schema = "public"
extensions = ["pg_uuidv7"]

# ---------------------------------------------------------------------------
# Enum types
# ---------------------------------------------------------------------------

[types.trust_tier]
kind = "enum"
values = ["anonymous", "identified", "verified", "system"]
comment = "Consumer trust level"

[types.credential_type]
kind = "enum"
values = ["api_key", "bearer", "hmac"]
comment = "Credential authentication mechanism"

# ---------------------------------------------------------------------------
# Tables: Consumers
# ---------------------------------------------------------------------------

[tables.consumers]
comment = "API consumers with trust tiers and scope grants."

[tables.consumers.columns.id]
type = "id"

[tables.consumers.columns.principal_id]
type = "ref"
comment = "The consumer's own identity row (kind='consumer', external_ref=consumer id). Historical rows are backfilled to a minted per-consumer principal."

[tables.consumers.columns.name]
type = "str"
comment = "Human-readable consumer name"

[tables.consumers.columns.trust_tier]
type = "trust_tier"

[tables.consumers.columns.scope_grants]
type = "json"
default = "[]"
comment = "JSON array of granted scope strings"

[tables.consumers.columns.disabled_at]
type = "timestamp_optional"
comment = "Non-null means the consumer is disabled"

[tables.consumers.columns.created_at]
type = "timestamp"

[tables.consumers.checks.chk_consumers_name_not_empty]
expr = "name <> ''"

[tables.consumers.indexes.idx_consumers_scope_grants_gin]
columns = ["scope_grants"]
method = "gin"

# Cross-file FK: consumers.principal_id -> identity's principals table. pgdesign
# resolves this in its ALTER phase (topo sort merges all schema/ files). A
# consumer has exactly one identity row, so the column is UNIQUE.
[tables.consumers.fks.fk_consumers_principal]
columns = ["principal_id"]
ref_table = "principals"
ref_columns = ["id"]
on_delete = "RESTRICT"

[tables.consumers.unique.uq_consumers_principal_id]
columns = ["principal_id"]

# ---------------------------------------------------------------------------
# Tables: Credentials
# ---------------------------------------------------------------------------

[tables.credentials]
comment = "Hashed credentials linked to consumers."

[tables.credentials.columns.id]
type = "id"

[tables.credentials.columns.consumer_id]
type = "ref"

[tables.credentials.columns.credential_type]
type = "credential_type"

[tables.credentials.columns.credential_hash]
type = "str"
comment = "SHA-256 hash of the raw credential value"

[tables.credentials.columns.algorithm]
type = "str"
default = "sha256"
comment = "Hash algorithm used"

[tables.credentials.columns.metadata]
type = "json"
default = "{}"
comment = "Additional credential metadata"

[tables.credentials.columns.secret_ref]
type = "str_nullable"
comment = "Reference to a secret in the SecretRegistry for HMAC verification (not smuggled through metadata)"

[tables.credentials.columns.created_at]
type = "timestamp"

[tables.credentials.checks.chk_credentials_hash_not_empty]
expr = "credential_hash <> '' AND algorithm <> ''"

[tables.credentials.fks.fk_credentials_consumer]
columns = ["consumer_id"]
ref_table = "consumers"
ref_columns = ["id"]
on_delete = "CASCADE"

[tables.credentials.indexes.idx_credentials_consumer_id]
columns = ["consumer_id"]

[tables.credentials.indexes.idx_credentials_hash]
columns = ["credential_hash"]

[tables.credentials.indexes.idx_credentials_metadata_gin]
columns = ["metadata"]
method = "gin"
