format_version = 1
# dispatch module PostgreSQL schema
# Single owner: the dispatch module. Event sources, subscriptions, actions,
# and accumulator buffering.
#
# Cross-file FK references: subscriptions.principal_id -> identity's principals
# table, sources.created_by -> identity's principals table,
# accumulator_buffer.event_id -> trace's events table. pgdesign resolves these
# when generating from the schema/ directory (topo sort merges all files).

[meta]
version = 3
schema = "public"

# ---------------------------------------------------------------------------
# Tables: Event sources
# ---------------------------------------------------------------------------

[tables.sources]
comment = "Registry of event sources (webhook endpoints, polled APIs, internal emitters)."

[tables.sources.columns.id]
type = "id"

[tables.sources.columns.slug]
type = "str"
comment = "URL-safe unique identifier"

[tables.sources.columns.name]
type = "str"
comment = "Human-readable source name"

[tables.sources.columns.credential_id]
type = "uuid_val_nullable"
comment = "FK to auth.credentials for source authentication"

[tables.sources.columns.config]
type = "jsonb_nullable"
comment = "Per-source mapping config (event_type extraction, field mapping)"

[tables.sources.columns.created_by]
type = "ref"
comment = "The creating actor's principal. Historical rows are backfilled to the system principal (the original creator is unknowable)."

[tables.sources.columns.created_at]
type = "timestamp"

[tables.sources.checks.chk_sources_slug_not_empty]
expr = "slug <> '' AND name <> ''"

[tables.sources.indexes.idx_sources_config_gin]
columns = ["config"]
method = "gin"

[tables.sources.unique.uq_sources_slug]
columns = ["slug"]

# Cross-file FK: sources.created_by -> identity's principals table. pgdesign
# resolves this in its ALTER phase (topo sort merges all schema/ files), the
# same way runs.created_by references identity's principals table.
[tables.sources.fks.fk_sources_created_by]
columns = ["created_by"]
ref_table = "principals"
ref_columns = ["id"]
on_delete = "RESTRICT"

[tables.sources.indexes.idx_sources_created_by]
columns = ["created_by"]

# ---------------------------------------------------------------------------
# Tables: Subscriptions
# ---------------------------------------------------------------------------

[tables.subscriptions]
comment = "Event subscriptions. A subscription matches events via filter_expr and routes them to actions."

[tables.subscriptions.columns.id]
type = "id"

[tables.subscriptions.columns.source_id]
type = "ref"
nullable = true
comment = "Optional source filter (null = match all sources)"

[tables.subscriptions.columns.filter_expr]
type = "json"
default = "{}"
comment = "FilterPredicate serialized as JSON"

[tables.subscriptions.columns.enabled]
type = "flag"
default = "true"

[tables.subscriptions.columns.storage]
type = "str"
default = "persistent"
comment = "Storage mode: persistent or transient"

[tables.subscriptions.columns.principal_id]
type = "ref"
comment = "The owning actor's principal. A subscription is operational state owned by its principal (a consumer, run, or the system)."

[tables.subscriptions.columns.created_at]
type = "timestamp"

[tables.subscriptions.checks.chk_subscriptions_storage_valid]
expr = "storage IN ('persistent', 'transient')"

[tables.subscriptions.fks.fk_subscriptions_source]
columns = ["source_id"]
ref_table = "sources"
ref_columns = ["id"]
on_delete = "SET NULL"

# Cross-file FK: subscriptions.principal_id -> identity's principals table.
# ON DELETE CASCADE is deliberate: a subscription is operational state that dies
# with its owner. This contrasts with the RESTRICT history FKs (events,
# runs.created_by, sources.created_by, consumers.principal_id) which anchor
# durable attribution and block deletion of a referenced principal. Deleting an
# owning principal takes its subscriptions with it; deleting one that fired
# events is refused.
[tables.subscriptions.fks.fk_subscriptions_principal]
columns = ["principal_id"]
ref_table = "principals"
ref_columns = ["id"]
on_delete = "CASCADE"

[tables.subscriptions.indexes.idx_subscriptions_principal_id]
columns = ["principal_id"]

[tables.subscriptions.indexes.idx_subscriptions_active]
columns = ["source_id", "created_at"]
where = "enabled = true"

[tables.subscriptions.indexes.idx_subscriptions_filter_expr_gin]
columns = ["filter_expr"]
method = "gin"

# ---------------------------------------------------------------------------
# Tables: Subscription actions
# ---------------------------------------------------------------------------

[tables.subscription_actions]
comment = "Ordered action pipeline for a subscription. Each action processes matched events."

[tables.subscription_actions.columns.id]
type = "id"

[tables.subscription_actions.columns.subscription_id]
type = "ref"

[tables.subscription_actions.columns.position]
type = "int"
comment = "Execution order within the subscription"

[tables.subscription_actions.columns.action_type]
type = "str"
comment = "Action type identifier (e.g. script, log, webhook)"

[tables.subscription_actions.columns.action_config]
type = "json"
default = "{}"
comment = "Action-specific configuration"

[tables.subscription_actions.columns.accumulator_config]
type = "jsonb_nullable"
comment = "Accumulator settings (batch size, flush interval, etc.)"

[tables.subscription_actions.columns.created_at]
type = "timestamp"

[tables.subscription_actions.checks.chk_subscription_actions_position_positive]
expr = "position >= 0 AND action_type <> ''"

[tables.subscription_actions.fks.fk_subscription_actions_sub]
columns = ["subscription_id"]
ref_table = "subscriptions"
ref_columns = ["id"]
on_delete = "CASCADE"

[tables.subscription_actions.indexes.idx_subscription_actions_sub]
columns = ["subscription_id"]

[tables.subscription_actions.indexes.idx_subscription_actions_config_gin]
columns = ["action_config"]
method = "gin"

[tables.subscription_actions.indexes.idx_subscription_actions_accumulator_gin]
columns = ["accumulator_config"]
method = "gin"

[tables.subscription_actions.unique.uq_subscription_actions_position]
columns = ["subscription_id", "position"]

# ---------------------------------------------------------------------------
# Tables: Accumulator buffer
# ---------------------------------------------------------------------------

[tables.accumulator_buffer]
comment = "Buffered events awaiting batch delivery for accumulator-enabled actions."

[tables.accumulator_buffer.columns.id]
type = "id"

[tables.accumulator_buffer.columns.subscription_action_id]
type = "ref"

[tables.accumulator_buffer.columns.event_id]
type = "ref"
comment = "Reference to the trace events table"

[tables.accumulator_buffer.columns.created_at]
type = "timestamp"

[tables.accumulator_buffer.checks.chk_accumulator_buffer_refs_not_null]
expr = "subscription_action_id IS NOT NULL AND event_id IS NOT NULL"

[tables.accumulator_buffer.fks.fk_accumulator_buffer_action]
columns = ["subscription_action_id"]
ref_table = "subscription_actions"
ref_columns = ["id"]
on_delete = "CASCADE"

[tables.accumulator_buffer.fks.fk_accumulator_buffer_event]
columns = ["event_id"]
ref_table = "events"
ref_columns = ["id"]
on_delete = "CASCADE"

[tables.accumulator_buffer.indexes.idx_accumulator_buffer_action]
columns = ["subscription_action_id"]

[tables.accumulator_buffer.indexes.idx_accumulator_buffer_event]
columns = ["event_id"]

# ---------------------------------------------------------------------------
# Tables: Dispatch cursor (durable processing position)
# ---------------------------------------------------------------------------

[tables.dispatch_cursor]
comment = "Durable cursor tracking the last processed event for the dispatcher worker."
pk = ["id"]

[tables.dispatch_cursor.columns.id]
type = "id"

[tables.dispatch_cursor.columns.cursor_name]
type = "str"
default = "main"
comment = "Named cursor (supports multiple independent consumers)"

[tables.dispatch_cursor.columns.last_processed_event_id]
type = "ref"
comment = "FK to events: the last event that was fully processed"

[tables.dispatch_cursor.columns.last_processed_at]
type = "timestamp"

[tables.dispatch_cursor.checks.chk_dispatch_cursor_name_not_empty]
expr = "cursor_name <> ''"

[tables.dispatch_cursor.fks.fk_dispatch_cursor_event]
columns = ["last_processed_event_id"]
ref_table = "events"
ref_columns = ["id"]
on_delete = "RESTRICT"

[tables.dispatch_cursor.unique.uq_dispatch_cursor_name]
columns = ["cursor_name"]

[tables.dispatch_cursor.indexes.idx_dispatch_cursor_event]
columns = ["last_processed_event_id"]

# ---------------------------------------------------------------------------
# Tables: Dispatch completions (per-event-action completion records)
# ---------------------------------------------------------------------------

[tables.dispatch_completions]
comment = "Per-event-action completion records for at-least-once delivery tracking."

[tables.dispatch_completions.columns.id]
type = "id"

[tables.dispatch_completions.columns.event_id]
type = "ref"
comment = "The event that was processed"

[tables.dispatch_completions.columns.subscription_action_id]
type = "ref"
comment = "The action that processed the event"

[tables.dispatch_completions.columns.result_status]
type = "str"
comment = "Outcome: success, error, skipped"

[tables.dispatch_completions.columns.completed_at]
type = "timestamp"

[tables.dispatch_completions.checks.chk_dispatch_completions_status_valid]
expr = "result_status IN ('success', 'error', 'skipped')"

[tables.dispatch_completions.fks.fk_dispatch_completions_event]
columns = ["event_id"]
ref_table = "events"
ref_columns = ["id"]
on_delete = "RESTRICT"

[tables.dispatch_completions.fks.fk_dispatch_completions_action]
columns = ["subscription_action_id"]
ref_table = "subscription_actions"
ref_columns = ["id"]
on_delete = "CASCADE"

[tables.dispatch_completions.unique.uq_dispatch_completions_event_action]
columns = ["event_id", "subscription_action_id"]

[tables.dispatch_completions.indexes.idx_dispatch_completions_event]
columns = ["event_id"]

[tables.dispatch_completions.indexes.idx_dispatch_completions_action]
columns = ["subscription_action_id"]
