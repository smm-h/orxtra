[project]
name = "orxtra"
version = "0.1.0"
schemas = ["trace.toml", "dispatch.toml", "auth.toml", "identity.toml", "notification.toml"]

[validate]
disable = [
    # I002 (dead column): Nearly every data column in this pre-production schema
    # triggers this because we haven't yet added application-level indexes or
    # constraints on them. Disabling globally avoids 100+ suppress entries that
    # would all say the same thing. Re-enable when the schema matures and we add
    # targeted indexes for actual query patterns.
    "I002",
]

[suppress]
"overseer_workflow_status.W005" = "Uses updated_at instead of created_at; this table is intentionally overwritten, not appended"
"run_heartbeats.W005" = "Uses last_heartbeat instead of created_at; heartbeats are overwritten, not appended"
"task_iterations.W005" = "Uses started_at instead of created_at; iteration is created and started in the same transaction"
# --- Intentional mixed ON DELETE policy ---
# Operational-state tables (decisions, constraints, lessons, inbox_items, etc.)
# CASCADE on run/task deletion because their data is meaningless without the
# parent. Audit tables (events, transcripts, notepad_entries) use RESTRICT to
# prevent accidental data loss -- runs with audit records must be explicitly
# cleaned.
"runs.W014" = "Cascade blast radius is intentional: operational-state tables cascade on run deletion while audit tables use RESTRICT"
"runs.W015" = "Mixed ON DELETE by table class: CASCADE for operational state, RESTRICT for audit (events/transcripts/notepad)"
"tasks.W015" = "Mixed ON DELETE by table class: CASCADE for operational state (attempts/iterations/children), RESTRICT for audit (events)"
"events.W015" = "Mixed ON DELETE by table class: CASCADE for accumulator_buffer (transient operational data), RESTRICT for dispatch_cursor and dispatch_completions (durable delivery records)"
# Incoming FKs to principals mix ON DELETE by referent class: CASCADE for
# operational state (subscriptions -- owned by a principal, meaningless without
# it), RESTRICT for durable history/attribution (events, runs.created_by,
# sources.created_by, consumers.principal_id, inbox_items.resolved_by). A
# principal that anchors history is undeletable; deleting one takes only its
# operational state with it.
"principals.W015" = "Mixed ON DELETE by referent class: CASCADE for operational state (subscriptions), RESTRICT for durable history/attribution (events, runs.created_by, sources.created_by, consumers.principal_id, inbox_items.resolved_by)"
"dispatch_cursor.W005" = "Uses last_processed_at instead of created_at; cursor rows are upserted, not appended"
"dispatch_completions.W005" = "Uses completed_at instead of created_at; completion is recorded when the action finishes"
