[project]
name = "orxtra-session"
version = "0.11.0"
license = "BUSL-1.1"
description = "Session lifecycle, token tracking, cross-restart resumption via PG transcripts."
requires-python = ">=3.12"
dependencies = [
    "orxtra-protocols",
    "orxtra-trace",
    "orxtra-transport",
]
keywords = ["rlsbl"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]

[tool.uv.sources]
orxtra-protocols = { workspace = true }
orxtra-transport = { workspace = true }
orxtra-trace = { workspace = true }
