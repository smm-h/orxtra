# A coding agent with git and command execution capabilities.
# Agents are TOML files with an associated .md prompt file (the `prompt`
# key in [agent] is a path relative to this file).
# Each [[tools.define]] entry defines one purpose-built command tool;
# the "custom.*" wildcard in the allow list gates them.

[agent]
name = "coder"
description = "Agent that writes code, runs tests, and commits changes."
prompt = "coder_agent.md"
category = "default"

[tools]
allow = ["read", "write", "edit", "git", "custom.*", "start_task", "end_task"]

[[tools.define]]
name = "pytest"
description = "Run the test suite"
namespace = "custom.exec"
deferred = false

[tools.define.execution]
type = "command"
executable = "pytest"
arg_validation = true
timeout_ceiling = 120

[[tools.define]]
name = "ruff"
description = "Run the ruff linter"
namespace = "custom.exec"
deferred = false

[tools.define.execution]
type = "command"
executable = "ruff"
arg_validation = true
timeout_ceiling = 120

[[tools.define]]
name = "mypy"
description = "Run the mypy type checker"
namespace = "custom.exec"
deferred = false

[tools.define.execution]
type = "command"
executable = "mypy"
arg_validation = true
timeout_ceiling = 120
