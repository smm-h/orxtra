# Minimal agent definition for orxtra.
# Load with: orxtra.agent.load_agent(Path("examples/basic_agent.toml"))

[agent]
name = "basic-agent"
description = "A minimal agent that reads and writes files."
prompt = "basic_agent.md"
category = "default"

[tools]
allow = ["read", "write", "start_task", "end_task"]
