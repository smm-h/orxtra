[project]
name = "orxtra-incoming"
version = "0.10.1"
license = "BUSL-1.1"
description = "Webhook receiver, event replay, and SSE stream. External event ingestion for the event bus."
requires-python = ">=3.12"
dependencies = [
    "fastware>=0.5.0",
    "orxtra-protocols",
    "orxtra-services",
    "orxtra-auth",
    "orxtra-trace",
    "orxtra-dispatch",
    "orxtra-secrets",
]
keywords = ["rlsbl"]

[dependency-groups]
dev = ["pytest>=9.1.0", "pytest-asyncio>=1.4.0", "uuid6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]

[tool.uv.sources]
orxtra-protocols = { workspace = true }
orxtra-services = { workspace = true }
orxtra-auth = { workspace = true }
orxtra-trace = { workspace = true }
orxtra-dispatch = { workspace = true }
orxtra-secrets = { workspace = true }
