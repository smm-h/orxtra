[project]
name = "orxtra-a2a"
version = "0.12.0"
license = "BUSL-1.1"
description = "A2A (Agent-to-Agent) protocol server for orxtra"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]",
    "strictspec>=0.1.0",
    "orxtra-services",
    "orxtra-protocols",
]
keywords = ["rlsbl"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]

[tool.uv.sources]
orxtra-services = { workspace = true }
orxtra-protocols = { workspace = true }

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
