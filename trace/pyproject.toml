[project]
name = "orxtra-trace"
version = "0.10.1"
license = "BUSL-1.1"
description = "PG schema owner. Events, task results, transcripts, inbox, state machines, crash recovery."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "asyncpg",
    "uuid6",
    "orxtra-protocols",
]
keywords = ["rlsbl"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]

[tool.uv.sources]
orxtra-protocols = { workspace = true }
