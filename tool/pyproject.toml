[project]
name = "orxtra-tool"
version = "0.12.0"
license = "BUSL-1.1"
description = "Tool registry with granular constructors. Path enforcement, write safety, no-truncation previews."
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "jsonschema",
    "pathspec",
    "pydantic>=2",
    "pydantic-monty==0.0.18",
    "strictspec>=0.1.0",
    "orxtra-protocols",
    "orxtra-secrets",
    "orxtra-write-safety",
]
keywords = ["rlsbl"]

[tool.uv.sources]
orxtra-protocols = { workspace = true }
orxtra-secrets = { workspace = true }
orxtra-write-safety = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]
