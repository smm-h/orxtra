[project]
name = "orxtra-mcp"
version = "0.12.0"
license = "BUSL-1.1"
description = "MCP server exposing the orxtra API. Human interface via dashboard or AI client."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2",
    "orxtra-protocols",
    "orxtra-services",
]
keywords = ["rlsbl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]

[tool.uv.sources]
orxtra-protocols = { workspace = true }
orxtra-services = { workspace = true }

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
