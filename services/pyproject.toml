[project]
name = "orxtra-services"
version = "0.11.0"
license = "BUSL-1.1"
description = "Shared business logic for all frontends. Run, inbox, trace queries, validation, config."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "asyncpg",
    "uuid6",
    "orxtra-agent",
    "orxtra-auth",
    "orxtra-dispatch",
    "orxtra-identity",
    "orxtra-notification",
    "orxtra-overseer",
    "orxtra-protocols",
    "orxtra-scheduler",
    "orxtra-secrets",
    "orxtra-session",
    "orxtra-tool",
    "orxtra-trace",
    "orxtra-transport",
]
keywords = ["rlsbl"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]

[tool.uv.sources]
orxtra-agent = { workspace = true }
orxtra-auth = { workspace = true }
orxtra-dispatch = { workspace = true }
orxtra-identity = { workspace = true }
orxtra-notification = { workspace = true }
orxtra-overseer = { workspace = true }
orxtra-protocols = { workspace = true }
orxtra-scheduler = { workspace = true }
orxtra-secrets = { workspace = true }
orxtra-session = { workspace = true }
orxtra-tool = { workspace = true }
orxtra-trace = { workspace = true }
orxtra-transport = { workspace = true }
