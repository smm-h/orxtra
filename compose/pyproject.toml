[project]
name = "orxtra-compose"
version = "0.11.0"
license = "BUSL-1.1"
description = "Fragment-based prompt composition engine. Strict variable substitution, include resolution, priority ordering."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]
keywords = ["rlsbl"]

[dependency-groups]
dev = ["pytest>=9.1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]
