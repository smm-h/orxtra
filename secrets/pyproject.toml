[project]
name = "orxtra-secrets"
version = "0.11.0"
license = "BUSL-1.1"
description = "Secret registry, substitution, and scrubbing. Secrets never reach the model or the database."
requires-python = ">=3.12"
dependencies = [
    "orxtra-protocols",
]
keywords = ["rlsbl"]

[dependency-groups]
dev = ["pytest>=9.1.0"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]

[tool.uv.sources]
orxtra-protocols = { workspace = true }
