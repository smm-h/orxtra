[project]
name = "orxtra-a2ui"
version = "0.9.0"
license = "BUSL-1.1"
description = "Agent-to-UI surface rendering. Template registry, fragment library, data-bound component engine."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "orxtra-protocols",
]
keywords = ["rlsbl"]

[tool.uv.sources]
orxtra-protocols = { workspace = true }

[dependency-groups]
dev = ["pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]
