# orxtra monorepo workspace
# Philosophy: complexity if you need it, simplicity if you don't.
# Each sub-project is independently useful for a narrow purpose.
# Together they compose into a full autonomous agent orchestration system.

# --- Releasables ---

[[releasables]]
name = "orxtra"

# --- Root package ---

[[projects]]
path = "."
# Explicit name: rlsbl otherwise derives it from the path basename, and
# os.path.basename(".") is ".". The router uses the project name verbatim as a
# paths-filter key, a detect output key and a job-key prefix, so the default
# would emit `needs.detect.outputs..` and job ids starting with a dot -- an
# invalid workflow. Every other member is happy with the derived basename.
name = "root"
description = "Root package — single publishable wheel aggregating all sub-projects"
releasable = "orxtra"
watch = [
    "pyproject.toml",
    "selfdoc.json",
    "docs/**",
    "scripts/**",
    "examples/**",
    "knowledge/**",
    "tests/**",
    ".github/**",
    "todo/**",
    "CLAUDE.md",
    "LICENSE",
    ".env",
    ".gitignore",
]

# --- Foundation layer ---

[[projects]]
path = "protocols"
description = "Shared types: Execution, task lifecycle, event descriptors, action tool schemas"
library = true
releasable = "orxtra"

[[projects]]
path = "secrets"
description = "Secret registry, substitution, and scrubbing"
depends_on = ["protocols"]
library = true
releasable = "orxtra"

[[projects]]
path = "write-safety"
description = "Write queue, stale-write detection, atomic replace, transient replay"
library = true
releasable = "orxtra"

[[projects]]
path = "transport"
description = "Typed LLM client via Provider protocol"
depends_on = ["protocols"]
library = true
releasable = "orxtra"

[[projects]]
path = "agent"
description = "Agent definition loader (TOML + composable .md prompts)"
depends_on = ["compose"]
library = true
releasable = "orxtra"

[[projects]]
path = "tool"
description = "Tool registry with granular constructors"
depends_on = ["protocols", "secrets", "write-safety"]
library = true
releasable = "orxtra"

[[projects]]
path = "verify"
description = "Check runner (pre/post-check Execution dispatch)"
depends_on = ["protocols"]
library = true
releasable = "orxtra"

[[projects]]
path = "trace"
description = "PG schema owner (events, task results, transcripts, inbox, state machines)"
depends_on = ["protocols"]
library = true
releasable = "orxtra"

[[projects]]
path = "notepad"
description = "Append-only cross-agent context sharing"
depends_on = ["trace"]
library = true
releasable = "orxtra"

[[projects]]
path = "session"
description = "Session lifecycle, token tracking, cross-restart resumption"
depends_on = ["protocols", "transport", "trace"]
library = true
releasable = "orxtra"

[[projects]]
path = "compose"
description = "Fragment-based prompt composition engine. Strict variable substitution, include resolution, priority ordering."
library = true
releasable = "orxtra"

[[projects]]
path = "auth"
description = "Authentication and authorization. Consumer registry, credential hashing, ASGI middleware."
depends_on = ["protocols"]
library = true
releasable = "orxtra"

[[projects]]
path = "identity"
description = "Identity model: persisted principals for durable actor identity."
depends_on = ["protocols"]
library = true
releasable = "orxtra"

[[projects]]
path = "a2ui"
description = "Agent-to-UI surface rendering. Template registry, fragment library, data-bound component engine."
depends_on = ["protocols"]
library = true
releasable = "orxtra"

[[projects]]
path = "notification"
description = "Notification delivery: persisted notifications for principals via the dispatch subscription system."
depends_on = ["identity", "protocols"]
library = true
releasable = "orxtra"

# --- Orchestration layer ---

[[projects]]
path = "scheduler"
description = "Task executor (recursive hierarchy, budgets, constraints)"
depends_on = ["protocols", "agent", "compose", "tool", "write-safety", "session", "trace", "verify", "notepad", "secrets", "transport", "dispatch", "worker"]
releasable = "orxtra"

[[projects]]
path = "dispatch"
description = "Event delivery: subscriptions, action dispatch, accumulator flush"
depends_on = ["protocols", "trace"]
library = true
releasable = "orxtra"

# --- Intelligence layer ---

[[projects]]
path = "overseer"
description = "Persistent LLM with action tools, PG memory, session handoff"
depends_on = ["protocols", "trace", "session", "tool", "transport"]
releasable = "orxtra"

# --- Composition layer ---

[[projects]]
path = "services"
description = "Shared business logic for all frontends"
depends_on = ["agent", "auth", "dispatch", "identity", "notification", "overseer", "protocols", "scheduler", "secrets", "session", "tool", "trace", "transport"]
releasable = "orxtra"

# --- Interface layer ---

[[projects]]
path = "cli"
description = "strictcli CLI frontend (agents are the primary users)"
depends_on = ["api", "identity", "notification", "protocols", "services", "worker"]
releasable = "orxtra"

[[projects]]
path = "mcp"
description = "MCP server (human interface via dashboard/AI client)"
depends_on = ["protocols", "services"]
releasable = "orxtra"

[[projects]]
path = "a2a"
description = "A2A (Agent-to-Agent) protocol server"
depends_on = ["protocols", "services"]
releasable = "orxtra"

[[projects]]
path = "agui"
description = "AG-UI streaming protocol for human frontends. Event translation, SSE server, state snapshots."
depends_on = ["identity", "protocols", "services", "transport"]
releasable = "orxtra"

[[projects]]
path = "worker"
description = "Brain-worker protocol: remote tool execution over WebSocket."
depends_on = ["protocols", "tool", "write-safety", "auth", "secrets"]
library = true
releasable = "orxtra"

[[projects]]
path = "incoming"
description = "Webhook receiver, event replay, and SSE stream. External event ingestion for the event bus."
depends_on = ["auth", "dispatch", "protocols", "secrets", "services", "trace"]
releasable = "orxtra"

[[projects]]
path = "api"
description = "HTTP compositor: mounts MCP, A2A, AG-UI, and native routes on a single ASGI app."
depends_on = ["a2a", "agui", "auth", "dispatch", "identity", "incoming", "mcp", "notification", "protocols", "secrets", "services", "trace", "worker"]
releasable = "orxtra"

# --- Infrastructure ---

[[projects]]
path = "schema"
description = "pgdesign database schema definitions"
dev_node = true
releasable = false

[[projects]]
path = "npm"
description = "npm shim package wrapping the Python CLI"
dev_node = true
releasable = false

# --- Architecture layers ---

[layers]
order = ["foundation", "orchestration", "intelligence", "composition", "interfaces"]

[layers.assignments]
foundation = ["protocols", "secrets", "write-safety", "transport", "agent", "tool", "verify", "trace", "notepad", "session", "compose", "auth", "identity", "a2ui", "worker", "notification"]
orchestration = ["scheduler", "dispatch"]
intelligence = ["overseer"]
composition = ["services"]
interfaces = ["cli", "mcp", "a2a", "agui", "api", "incoming"]
