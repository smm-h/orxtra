[project]
name = "orxtra-notification"
version = "0.13.0"
license = "BUSL-1.1"
description = "Notification delivery: persisted notifications for principals via the dispatch subscription system."
requires-python = ">=3.12"
dependencies = [
    "orxtra-protocols",
    "orxtra-identity",
    "asyncpg",
    "fastware>=0.5.0",
    "uuid6",
]
keywords = ["rlsbl"]

[dependency-groups]
dev = ["pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]

[tool.uv.sources]
orxtra-identity = { workspace = true }
orxtra-protocols = { workspace = true }
