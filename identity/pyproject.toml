[project]
name = "orxtra-identity"
version = "0.11.0"
license = "BUSL-1.1"
description = "Identity model: persisted principals for durable actor identity."
requires-python = ">=3.12"
dependencies = [
    "orxtra-protocols",
    "asyncpg",
    "uuid6",
]
keywords = ["rlsbl"]

[dependency-groups]
dev = ["pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]

[tool.uv.sources]
orxtra-protocols = { workspace = true }
