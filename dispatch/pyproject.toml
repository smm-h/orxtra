[project]
name = "orxtra-dispatch"
version = "0.12.0"
license = "BUSL-1.1"
description = "Event delivery: subscriptions, action dispatch, accumulator flush."
requires-python = ">=3.12"
dependencies = [
    "asyncpg",
    "uuid6",
    "orxtra-protocols",
    "orxtra-trace",
]
keywords = ["rlsbl"]

[dependency-groups]
dev = ["pytest-asyncio>=1.4.0", "orxtra-notification"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]

[tool.uv.sources]
orxtra-notification = { workspace = true }
orxtra-protocols = { workspace = true }
orxtra-trace = { workspace = true }
