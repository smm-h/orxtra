[project]
name = "orxtra-cli"
version = "0.12.0"
license = "BUSL-1.1"
description = "strictcli CLI frontend. Agents are the primary users."
requires-python = ">=3.12"
dependencies = [
    "asyncpg",
    # The 0.41 line makes presence a mandatory declaration and bans a value
    # default on a mutating command; _cli.py, _dispatch.py and _db.py are
    # written to those rules and an older strictcli has no `presence=` keyword.
    "strictcli>=0.41.1",
    "orxtra-api",
    "orxtra-identity",
    "orxtra-notification",
    "orxtra-protocols",
    "orxtra-services",
    "orxtra-worker",
]
keywords = ["rlsbl"]

[dependency-groups]
dev = ["pytest>=9.1.0"]

[project.scripts]
orxtra = "orxtra.cli._cli:main"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]

[tool.uv.sources]
orxtra-api = { workspace = true }
orxtra-identity = { workspace = true }
orxtra-notification = { workspace = true }
orxtra-protocols = { workspace = true }
orxtra-services = { workspace = true }
orxtra-worker = { workspace = true }
