[project]
name = "orxtra-worker"
version = "0.11.0"
license = "BUSL-1.1"
description = "Brain-worker protocol: remote tool execution over WebSocket."
requires-python = ">=3.12"
dependencies = [
    "fastware>=0.5.0",
    "pydantic>=2",
    "strictcli",
    "websockets",
    "orxtra-auth",
    "orxtra-protocols",
    "orxtra-secrets",
    "orxtra-tool",
    "orxtra-write-safety",
]
keywords = ["rlsbl"]

[dependency-groups]
dev = ["pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]

[tool.uv.sources]
orxtra-protocols = { workspace = true }
orxtra-tool = { workspace = true }
orxtra-write-safety = { workspace = true }
orxtra-auth = { workspace = true }
orxtra-secrets = { workspace = true }
