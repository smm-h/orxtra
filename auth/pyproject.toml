[project]
name = "orxtra-auth"
version = "0.7.0"
license = "BUSL-1.1"
description = "Authentication and authorization. Consumer registry, credential hashing, ASGI middleware."
requires-python = ">=3.12"
dependencies = [
    "orxtra-protocols",
    "asyncpg",
]
keywords = ["rlsbl"]

[dependency-groups]
dev = ["pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]

[tool.uv.sources]
orxtra-protocols = { workspace = true }
