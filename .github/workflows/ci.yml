name: Root Tests

# This is the workspace ROOT member's CI source (workspace.toml: path = ".",
# name = "root"). `rlsbl monorepo sync` inlines these jobs into ci-router.yml
# as `root-ci-*`, where they get the router's push/PR triggers plus the
# paths-filter gate. CI-source discovery only ever matches `ci.yml` and
# `ci-*.yml`, which is why this file cannot go back to being named test.yml:
# under the old name the router had no jobs for the root member at all.
#
# Every other member's ci.yml lives in a subdirectory, which GitHub ignores --
# only the jobs the router inlines ever run. The root member's ci.yml sits in
# the one directory GitHub DOES read, so a push/pull_request trigger here would
# run these jobs a second time, ungated, on every push. workflow_dispatch is
# therefore the only trigger: the router owns the automatic runs, and this file
# stays manually runnable on its own.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest tests/ -x -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uv sync
      - run: uv run ruff check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uv sync
      - run: bash scripts/run_mypy.sh

  import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uv sync
      - run: uv run python scripts/check_imports.py

  dep-declarations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uv sync
      - run: uv run python scripts/check_dep_declarations.py

  layer-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uv sync
      - run: uv run python scripts/check_layer_docs.py

  schema-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uv sync
      - run: uv tool install pgdesign
      - run: bash scripts/check_schema_codegen.sh
