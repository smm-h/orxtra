# DO NOT EDIT -- generated by rlsbl monorepo sync
name: CI Router
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      protocols: ${{ steps.changes.outputs.protocols }}
      secrets: ${{ steps.changes.outputs.secrets }}
      write-safety: ${{ steps.changes.outputs.write-safety }}
      transport: ${{ steps.changes.outputs.transport }}
      agent: ${{ steps.changes.outputs.agent }}
      tool: ${{ steps.changes.outputs.tool }}
      verify: ${{ steps.changes.outputs.verify }}
      trace: ${{ steps.changes.outputs.trace }}
      notepad: ${{ steps.changes.outputs.notepad }}
      session: ${{ steps.changes.outputs.session }}
      compose: ${{ steps.changes.outputs.compose }}
      auth: ${{ steps.changes.outputs.auth }}
      identity: ${{ steps.changes.outputs.identity }}
      a2ui: ${{ steps.changes.outputs.a2ui }}
      scheduler: ${{ steps.changes.outputs.scheduler }}
      dispatch: ${{ steps.changes.outputs.dispatch }}
      overseer: ${{ steps.changes.outputs.overseer }}
      services: ${{ steps.changes.outputs.services }}
      cli: ${{ steps.changes.outputs.cli }}
      mcp: ${{ steps.changes.outputs.mcp }}
      a2a: ${{ steps.changes.outputs.a2a }}
      agui: ${{ steps.changes.outputs.agui }}
      worker: ${{ steps.changes.outputs.worker }}
      incoming: ${{ steps.changes.outputs.incoming }}
      api: ${{ steps.changes.outputs.api }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v4
      id: changes
      with:
        filters: |
          protocols: 'protocols/**'
          secrets: 'secrets/**'
          write-safety: 'write-safety/**'
          transport: 'transport/**'
          agent: 'agent/**'
          tool: 'tool/**'
          verify: 'verify/**'
          trace: 'trace/**'
          notepad: 'notepad/**'
          session: 'session/**'
          compose: 'compose/**'
          auth: 'auth/**'
          identity: 'identity/**'
          a2ui: 'a2ui/**'
          scheduler: 'scheduler/**'
          dispatch: 'dispatch/**'
          overseer: 'overseer/**'
          services: 'services/**'
          cli: 'cli/**'
          mcp: 'mcp/**'
          a2a: 'a2a/**'
          agui: 'agui/**'
          worker: 'worker/**'
          incoming: 'incoming/**'
          api: 'api/**'
  protocols-ci-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # requires-python: >= 3.12
        python-version: ['3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
    - run: uv python install ${{ matrix.python-version }}
    - run: uv sync --locked
    - run: uv run python -c "import orxtra"
    defaults:
      run:
        working-directory: protocols
    name: protocols-ci / test
    needs:
    - detect
    if: needs.detect.outputs.protocols == 'true'
