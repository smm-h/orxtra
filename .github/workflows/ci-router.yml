# DO NOT EDIT -- generated by rlsbl monorepo sync
name: CI Router
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_all:
        description: Run every project's CI jobs, ignoring the paths filter. Use
          this to make a release candidate's members run their own CI on a 
          commit whose push window does not touch their paths.
        type: boolean
        required: false
        default: false
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.sha }}-${{ inputs.run_all }}
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.changes.outputs.root }}
      protocols: ${{ steps.changes.outputs.protocols }}
      secrets: ${{ steps.changes.outputs.secrets }}
      write-safety: ${{ steps.changes.outputs.write-safety }}
      transport: ${{ steps.changes.outputs.transport }}
      agent: ${{ steps.changes.outputs.agent }}
      tool: ${{ steps.changes.outputs.tool }}
      verify: ${{ steps.changes.outputs.verify }}
      trace: ${{ steps.changes.outputs.trace }}
      notepad: ${{ steps.changes.outputs.notepad }}
      session: ${{ steps.changes.outputs.session }}
      compose: ${{ steps.changes.outputs.compose }}
      auth: ${{ steps.changes.outputs.auth }}
      identity: ${{ steps.changes.outputs.identity }}
      a2ui: ${{ steps.changes.outputs.a2ui }}
      notification: ${{ steps.changes.outputs.notification }}
      scheduler: ${{ steps.changes.outputs.scheduler }}
      dispatch: ${{ steps.changes.outputs.dispatch }}
      overseer: ${{ steps.changes.outputs.overseer }}
      services: ${{ steps.changes.outputs.services }}
      cli: ${{ steps.changes.outputs.cli }}
      mcp: ${{ steps.changes.outputs.mcp }}
      a2a: ${{ steps.changes.outputs.a2a }}
      agui: ${{ steps.changes.outputs.agui }}
      worker: ${{ steps.changes.outputs.worker }}
      incoming: ${{ steps.changes.outputs.incoming }}
      api: ${{ steps.changes.outputs.api }}
      schema: ${{ steps.changes.outputs.schema }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v4
      id: changes
      with:
        filters: |
          root:
            - './**'
            - 'pyproject.toml'
            - 'selfdoc.json'
            - 'docs/**'
            - 'scripts/**'
            - 'examples/**'
            - 'knowledge/**'
            - 'tests/**'
            - '.github/**'
            - 'todo/**'
            - 'CLAUDE.md'
            - 'LICENSE'
            - '.env'
            - '.gitignore'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          protocols:
            - 'protocols/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          secrets:
            - 'secrets/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          write-safety:
            - 'write-safety/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          transport:
            - 'transport/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          agent:
            - 'agent/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          tool:
            - 'tool/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          verify:
            - 'verify/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          trace:
            - 'trace/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          notepad:
            - 'notepad/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          session:
            - 'session/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          compose:
            - 'compose/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          auth:
            - 'auth/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          identity:
            - 'identity/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          a2ui:
            - 'a2ui/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          notification:
            - 'notification/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          scheduler:
            - 'scheduler/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          dispatch:
            - 'dispatch/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          overseer:
            - 'overseer/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          services:
            - 'services/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          cli:
            - 'cli/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          mcp:
            - 'mcp/**'
            - '.rlsbl-monorepo/releasables/orxtra/CHANGELOG.md'
          a2a:
