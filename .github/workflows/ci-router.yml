  root-ci-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
    - run: uv python install ${{ matrix.python-version }}
    - run: uv sync
    - run: uv run pytest tests/ -x -q

    defaults:
      run:
        working-directory: .
    name: root-ci / test
    needs:
    - detect
    if: (needs.detect.outputs.root == 'true' || inputs.run_all)
  root-ci-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
    - run: uv python install 3.13
    - run: uv sync
    - run: uv run ruff check .

    defaults:
      run:
        working-directory: .
    name: root-ci / lint
