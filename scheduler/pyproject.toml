[project]
name = "orxtra-scheduler"
version = "0.11.0"
license = "BUSL-1.1"
description = "Task executor. Recursive task hierarchy, dependency graphs, budgets, constraints, crash recovery."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "jsonschema",
    "strictspec>=0.1.0",
    "orxtra-protocols",
    "orxtra-write-safety",
    "orxtra-agent",
    "orxtra-compose",
    "orxtra-dispatch",
    "orxtra-tool",
    "orxtra-session",
    "orxtra-trace",
    "orxtra-verify",
    "orxtra-notepad",
    "orxtra-secrets",
    "orxtra-transport",
]
keywords = ["rlsbl"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orxtra"]

[tool.uv.sources]
orxtra-protocols = { workspace = true }
orxtra-write-safety = { workspace = true }
orxtra-agent = { workspace = true }
orxtra-compose = { workspace = true }
orxtra-dispatch = { workspace = true }
orxtra-tool = { workspace = true }
orxtra-session = { workspace = true }
orxtra-trace = { workspace = true }
orxtra-verify = { workspace = true }
orxtra-notepad = { workspace = true }
orxtra-secrets = { workspace = true }
orxtra-transport = { workspace = true }
